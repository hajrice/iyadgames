# Deploys to Fly.io on every push to main (and on demand from the Actions tab).
# Needs one repo secret: FLY_API_TOKEN  (Fly dashboard → Tokens → "Deploy token" for app iyad-world)
name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create the data volume if it doesn't exist yet
        run: |
          if ! flyctl volumes list -a iyad-world --json | grep -q '"name": *"data"'; then
            flyctl volumes create data -a iyad-world --region fra --size 1 --yes
          fi

      - name: Deploy
        run: flyctl deploy --remote-only --ha=false

      - name: Make sure the app has public IPs (needed for the iyad.world DNS records)
        run: |
          ips="$(flyctl ips list -a iyad-world --json)"
          echo "$ips" | grep -q '"Type": *"v4"\|"Type": *"shared_v4"' || flyctl ips allocate-v4 --shared -a iyad-world
          echo "$ips" | grep -q '"Type": *"v6"' || flyctl ips allocate-v6 -a iyad-world
          echo "---- Use these in your registrar's DNS (A = v4, AAAA = v6) ----"
          flyctl ips list -a iyad-world

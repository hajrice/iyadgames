# Fly.io config for Iyad Games (iyad.world)
app = "iyad-world"
primary_region = "fra"   # Frankfurt — closest region to Bosnia

[build]

[env]
  PORT = "3000"
  DATA_DIR = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"     # keep it awake so the first kid of the day doesn't wait for a cold start
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "data"                # persistent volume — scores and players live here
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
